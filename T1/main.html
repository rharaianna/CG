<!DOCTYPE html>
<html>

<head>
   <title>Basic Scene</title>

   <link rel="shortcut icon" href="../favicon.ico">
   <link rel="stylesheet" href="../html/resources/default.css">
   <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
   <!-- Import maps polyfill -- Remove this when import maps will be widely supported-->
   <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
   <script type="importmap">
         {"imports": {"three": "../build/three.module.js",
       
        "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.7.3/build/index.module.js",
        "three-bvh-csg": "https://unpkg.com/three-bvh-csg@0.0.16/build/index.module.js"}} 
      </script>

   <div id="webgl-output">
      <script type="module" src="src/main.js"></script>
   </div>
   <style>
      #crosshair {
         position: fixed;
         top: 50%;
         left: 50%;
         transform: translate(-50%, -50%);
         width: 30px;
         height: 30px;
         pointer-events: none;
         /* deixa cliques passarem "através" dela */
         z-index: 10;
      }

      #crosshair::before,
      #crosshair::after {
         content: '';
         position: absolute;
         background: white;
         mix-blend-mode: difference;
         /* fica visível em fundo claro ou escuro */
      }

      #crosshair::before {
         /* linha horizontal */
         width: 100%;
         height: 2px;
         top: 50%;
         left: 0;
         transform: translateY(-50%);
      }

      #crosshair::after {
         /* linha vertical */
         width: 2px;
         height: 100%;
         left: 50%;
         top: 0;
         transform: translateX(-50%);
      }
   </style>

   <div id="crosshair"></div>
</body>

</html>
